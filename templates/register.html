{% extends "base.html" %}{% load static %}{% block title %}Register{% endblock %}
{% block content %}<main class="auth"><h1>Create account</h1>
<form id="register-form"><input name="username" placeholder="Username" required>
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password (min 8 chars)" required>
<button>Register</button><p class="err"></p></form>
<p>Already registered? <a href="/login/">Log in</a></p></main>{% endblock %}
{% block scripts %}<script src="{% static 'js/auth.js' %}"></script>{% endblock %}
